#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[wildcard]]
pattern = "~/code/**/*"
startup_command = "jj git fetch && jj log"

[[session]]
name = "dotfiles"
path = "~/.dotfiles/"
startup_command = "nvim"

[[session]]
name = "gcloud_tunnel"
path = "~/"
startup_command = "mr start_tunnel"

[[session]]
name = "k9s"
path = "~/"
startup_command = "k9s"

