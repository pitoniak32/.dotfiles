#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

[[wildcard]]
pattern = "~/code/**/*"
startup_command = "jj git fetch --tracked && jj log"

[[session]]
name = "quark"
path = "~/code/work/quark/"

[[session]]
name = "dotfiles"
path = "~/.dotfiles/"
startup_command = "nvim"

[[session]]
name = "notes"
path = "/Users/dvd/Documents/Synced/"
startup_command = "nvim Index.md -c ObsidianQuickSwitch"

[[session]]
name = "k9s"
path = "~/"
startup_command = "k9s"

